name: immutable release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Verify tag identity and refuse replacement
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists; public release overwrite is forbidden" >&2
            exit 1
          fi
          ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")
          test "$(jq -r '.object.type' <<< "$ref")" = "tag"
          tag_object=$(jq -r '.object.sha' <<< "$ref")
          target=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.object.sha')
          test "$target" = "$GITHUB_SHA"
          printf '%s\n' "$tag_object" > "$RUNNER_TEMP/tag-object.sha"
      - name: Preserve immutable v0.1.3 predecessor
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/381164402" > "$RUNNER_TEMP/predecessor.json"
          jq -e '
            .id == 381164402 and .tag_name == "v0.1.3" and .target_commitish == "516182dcff8c2ba0b34a2d1a2a8577d817a8fceb" and .draft == false and .immutable == true and
            (.assets|length) == 2 and
            ([.assets[] | select(.id == 541014765 and .name == "release-v0.1.3.tar.gz" and .digest == "sha256:12202b2b4748668a92553ac1f5b986f022bfe6096bc1c4db085de315d1470a29")]|length) == 1 and
            ([.assets[] | select(.id == 541014774 and .name == "release-v0.1.3.tar.gz.sha256" and .digest == "sha256:3168c24d0ea7dc77e4df3c34e0deb0de303efb9876611595837ba773e1f26472")]|length) == 1
          ' "$RUNNER_TEMP/predecessor.json" >/dev/null
      - name: Fetch green main CI evidence for this commit
        shell: bash
        run: |
          set -euo pipefail
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100")
          run_id=$(jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .conclusion == "success")][0].id // empty' <<< "$runs")
          test -n "$run_id"
          printf '%s\n' "$run_id" > "$RUNNER_TEMP/main-ci-run-id"
          gh run download "$run_id" --name "semantic-meta-package-resolver-evidence-${GITHUB_SHA}" --dir "$RUNNER_TEMP/main-evidence"
          test -s "$RUNNER_TEMP/main-evidence/ci-evidence-v2.json"
          jq -e '
            .schema == "gooo/semantic-meta-package-resolver/ci-evidence/v2" and .subject_sha == env.GITHUB_SHA and
            (.authority_mapping|length) == 12 and .metrics.state == "UNKNOWN" and
            .improvement.state == "UNKNOWN" and .improvement.value == null and .runtime.repository_writes == 0
          ' "$RUNNER_TEMP/main-evidence/ci-evidence-v2.json" >/dev/null
      - name: Build and create evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          go build ./...
          go test ./...
          bash scripts/semantic-audit.sh
          bash scripts/conformance.sh "$RUNNER_TEMP/conformance"
          bash scripts/conformance-v2.sh "$RUNNER_TEMP/conformance-v2"
          mkdir -p "$RUNNER_TEMP/bundle/conformance"
          cp "$RUNNER_TEMP/conformance/conformance.json" "$RUNNER_TEMP/bundle/conformance/conformance.json"
          cp -R "$RUNNER_TEMP/conformance-v2" "$RUNNER_TEMP/bundle/conformance/v2"
          cp "$RUNNER_TEMP/main-evidence/ci-evidence-v2.json" "$RUNNER_TEMP/bundle/ci-evidence-v2.json"
          cp "$RUNNER_TEMP/main-evidence/ci-evidence.json" "$RUNNER_TEMP/bundle/ci-evidence-v1.json"
          cp -R "$RUNNER_TEMP/main-evidence/conformance/v2/cases" "$RUNNER_TEMP/bundle/conformance/main-ci-cases"
          cp contracts/ci-evidence-v1.schema.json "$RUNNER_TEMP/bundle/ci-evidence-v1.schema.json"
          cp contracts/ci-evidence-v2.schema.json "$RUNNER_TEMP/bundle/ci-evidence-v2.schema.json"
          cp contracts/resolver-v2.gooo "$RUNNER_TEMP/bundle/resolver-v2.gooo"
          cp fixtures/v2/catalog.lock.json "$RUNNER_TEMP/bundle/catalog-v2.lock.json"
          cp fixtures/catalog.lock.json "$RUNNER_TEMP/bundle/catalog.lock.json"
          cp "$RUNNER_TEMP/tag-object.sha" "$RUNNER_TEMP/bundle/tag-object.sha"
          go run ./cmd/gooo-semantic-meta-package-resolver run \
            --source fixtures/cases/exact-lock.gooo --contract contracts/resolver.gooo \
            --catalog fixtures/catalog.json --catalog-lock fixtures/catalog.lock.json \
            --out "$RUNNER_TEMP/bundle/integration" --execute
          go run ./cmd/gooo-semantic-meta-package-resolver run \
            --source fixtures/v2/cases/exact-single.gooo --contract contracts/resolver-v2.gooo \
            --catalog fixtures/v2/catalog.json --catalog-lock fixtures/v2/catalog.lock.json \
            --out "$RUNNER_TEMP/bundle/integration-v2" --execute
          jq -S -n --arg tag "$GITHUB_REF_NAME" --arg target "$GITHUB_SHA" --arg ci_run_id "$(cat "$RUNNER_TEMP/main-ci-run-id")" --slurpfile predecessor "$RUNNER_TEMP/predecessor.json" '{tag:$tag,target_commit:$target,ci_run_id:($ci_run_id|tonumber),predecessor:{release_id:$predecessor[0].id,tag:$predecessor[0].tag_name,immutable:$predecessor[0].immutable,assets:[$predecessor[0].assets[]|{id,name,digest}]}}' > "$RUNNER_TEMP/bundle/release-metadata.json"
          tar -C "$RUNNER_TEMP/bundle" -czf "$RUNNER_TEMP/release-${GITHUB_REF_NAME}.tar.gz" .
          sha256sum "$RUNNER_TEMP/release-${GITHUB_REF_NAME}.tar.gz" | awk '{print $1}' > "$RUNNER_TEMP/release-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: Create draft release
        shell: bash
        run: |
          set -euo pipefail
          draft=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f target_commitish="$GITHUB_SHA" \
            -f name="$GITHUB_REF_NAME" -f body="Immutable semantic resolver evidence for $GITHUB_SHA; predecessor v0.1.3 (release 381164402) preserved." \
            -F draft=true -F prerelease=false)
          jq -e '.draft == true and .tag_name == env.GITHUB_REF_NAME and .target_commitish == env.GITHUB_SHA' <<< "$draft" >/dev/null
          jq -r '.id' <<< "$draft" > "$RUNNER_TEMP/release-id"
      - name: Upload draft assets without replacement
        shell: bash
        run: |
          set -euo pipefail
          id=$(cat "$RUNNER_TEMP/release-id")
          upload_url=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${id}" --jq '.upload_url' | sed 's/{?name,label}//')
          for asset in "$RUNNER_TEMP/release-${GITHUB_REF_NAME}.tar.gz" "$RUNNER_TEMP/release-${GITHUB_REF_NAME}.tar.gz.sha256"; do
            name=$(basename "$asset")
            case "$name" in
              *.tar.gz) content_type=application/gzip ;;
              *) content_type=text/plain ;;
            esac
            gh api --method POST "${upload_url}?name=${name}" -H "Content-Type: ${content_type}" --input "$asset" >/dev/null
          done
      - name: Publish draft then verify immutable release and asset digests
        shell: bash
        run: |
          set -euo pipefail
          id=$(cat "$RUNNER_TEMP/release-id")
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" -F draft=false > "$RUNNER_TEMP/published.json"
          jq -e '.draft == false and .immutable == true' "$RUNNER_TEMP/published.json" >/dev/null
          release_digest=$(jq -r --arg name "release-${GITHUB_REF_NAME}.tar.gz" '.assets[] | select(.name == $name) | .digest' "$RUNNER_TEMP/published.json")
          local_digest="sha256:$(cat "$RUNNER_TEMP/release-${GITHUB_REF_NAME}.tar.gz.sha256")"
          test "$release_digest" = "$local_digest"
          sidecar_digest=$(jq -r --arg name "release-${GITHUB_REF_NAME}.tar.gz.sha256" '.assets[] | select(.name == $name) | .digest' "$RUNNER_TEMP/published.json")
          test "$sidecar_digest" = "sha256:$(sha256sum "$RUNNER_TEMP/release-${GITHUB_REF_NAME}.tar.gz.sha256" | awk '{print $1}')"
          jq -e '{immutable,tag_name,target_commitish,assets:[.assets[]|{name,digest,size}]}' "$RUNNER_TEMP/published.json" >> "$GITHUB_STEP_SUMMARY"
