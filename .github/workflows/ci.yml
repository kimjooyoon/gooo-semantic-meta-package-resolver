name: semantic resolver CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Bind exact subject identity
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Start exact CI wall clock
        shell: bash
        run: date +%s%3N > "$RUNNER_TEMP/ci-start-ms"
      - name: Run semantic audit
        run: bash scripts/semantic-audit.sh
      - name: Compile packages
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f '%e %M' -o "$RUNNER_TEMP/compile.measure" go test -run '^$' ./...
          read seconds rss < "$RUNNER_TEMP/compile.measure"
          awk '{printf "%d\n", $1*1000}' <<< "$seconds" > "$RUNNER_TEMP/compile.wall"
          printf '%s\n' "$rss" > "$RUNNER_TEMP/compile.rss"
      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f '%e %M' -o "$RUNNER_TEMP/build.measure" go build ./...
          read seconds rss < "$RUNNER_TEMP/build.measure"
          awk '{printf "%d\n", $1*1000}' <<< "$seconds" > "$RUNNER_TEMP/build.wall"
          printf '%s\n' "$rss" > "$RUNNER_TEMP/build.rss"
      - name: Test packages
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f '%e %M' -o "$RUNNER_TEMP/test.measure" go test ./...
          read seconds rss < "$RUNNER_TEMP/test.measure"
          awk '{printf "%d\n", $1*1000}' <<< "$seconds" > "$RUNNER_TEMP/test.wall"
          printf '%s\n' "$rss" > "$RUNNER_TEMP/test.rss"
      - name: Vet and formatting checks
        run: |
          go vet ./...
          gofmt_diff="$(gofmt -d $(git ls-files '*.go'))"
          if [ -n "$gofmt_diff" ]; then
            printf '%s\n' "$gofmt_diff"
            exit 1
          fi
      - name: Seven-case conformance
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/conformance"
          mkdir -p "$evidence_dir"
          /usr/bin/time -f '%e %M' -o "$RUNNER_TEMP/conformance.measure" bash scripts/conformance.sh "$evidence_dir"
          read seconds rss < "$RUNNER_TEMP/conformance.measure"
          awk '{printf "%d\n", $1*1000}' <<< "$seconds" > "$RUNNER_TEMP/conformance.wall"
          printf '%s\n' "$rss" > "$RUNNER_TEMP/conformance.rss"
      - name: Twelve-case semantic import conformance
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/conformance-v2"
          mkdir -p "$evidence_dir"
          /usr/bin/time -f '%e %M' -o "$RUNNER_TEMP/conformance-v2.measure" bash scripts/conformance-v2.sh "$evidence_dir"
          read seconds rss < "$RUNNER_TEMP/conformance-v2.measure"
          awk '{printf "%d\n", $1*1000}' <<< "$seconds" > "$RUNNER_TEMP/conformance-v2.wall"
          printf '%s\n' "$rss" > "$RUNNER_TEMP/conformance-v2.rss"
      - name: Linked artifact integration
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/integration"
          /usr/bin/time -f '%e %M' -o "$RUNNER_TEMP/integration.measure" go run ./cmd/gooo-semantic-meta-package-resolver run \
            --source fixtures/cases/exact-lock.gooo --contract contracts/resolver.gooo \
            --catalog fixtures/catalog.json --catalog-lock fixtures/catalog.lock.json \
            --out "$out" --execute
          read seconds rss < "$RUNNER_TEMP/integration.measure"
          awk '{printf "%d\n", $1*1000}' <<< "$seconds" > "$RUNNER_TEMP/integration.wall"
          printf '%s\n' "$rss" > "$RUNNER_TEMP/integration.rss"
          jq -e '.status == "CLOSED" and (.output_digest|test("^sha256:"))' "$out/execution.json" >/dev/null
      - name: Linked semantic import integration
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/integration-v2"
          go run ./cmd/gooo-semantic-meta-package-resolver run \
            --source fixtures/v2/cases/exact-single.gooo --contract contracts/resolver-v2.gooo \
            --catalog fixtures/v2/catalog.json --catalog-lock fixtures/v2/catalog.lock.json \
            --out "$out" --execute
          jq -e '.status == "CLOSED" and (.output_digest|test("^sha256:"))' "$out/execution.json" >/dev/null
      - name: Build exact CI evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/evidence"
          mkdir -p "$evidence_dir/conformance"
          cp "$RUNNER_TEMP/conformance/conformance.json" "$evidence_dir/conformance/conformance.json"
          cp "$RUNNER_TEMP/conformance-v2/conformance-v2.json" "$evidence_dir/conformance/conformance-v2.json"
          mkdir -p "$evidence_dir/conformance/v2"
          cp "$RUNNER_TEMP/conformance-v2/conformance-v2.json" "$evidence_dir/conformance/v2/conformance-v2.json"
          cp -R "$RUNNER_TEMP/conformance-v2/cases" "$evidence_dir/conformance/v2/cases"
          bash scripts/write-ci-evidence.sh "$SUBJECT_SHA" \
            "$(cat "$RUNNER_TEMP/compile.wall")" "$(cat "$RUNNER_TEMP/compile.rss")" \
            "$(cat "$RUNNER_TEMP/build.wall")" "$(cat "$RUNNER_TEMP/build.rss")" \
            "$(cat "$RUNNER_TEMP/test.wall")" "$(cat "$RUNNER_TEMP/test.rss")" \
            "$(cat "$RUNNER_TEMP/conformance.wall")" "$(cat "$RUNNER_TEMP/conformance.rss")" \
            "$(cat "$RUNNER_TEMP/integration.wall")" "$(cat "$RUNNER_TEMP/integration.rss")" \
            7 7 7 0 0 0 "$evidence_dir" "$evidence_dir/ci-evidence.json"
          jq -e '
            .schema == "gooo/semantic-meta-package-resolver/ci-evidence/v1" and
            (.stages | to_entries | all(.value.wall_ms|type=="number" and floor==. and . >= 0)) and
            (.stages | to_entries | all(.value.peak_rss_kib|type=="number" and floor==. and . >= 0)) and
            .tests == {total:7,selected:7,executed:7,reused:0,failed:0,unknown:0} and
            .local_executions == {test:0,build:0,vet:0,conformance:0,integration:0} and .repository_writes == 0 and
            .improvement.state == "UNKNOWN" and .improvement.before == null and .improvement.after == null and
            .improvement.reason == "EXACT_BEFORE_AFTER_IDENTITY_PAIR_NOT_AVAILABLE"
          ' "$evidence_dir/ci-evidence.json" >/dev/null
          jq -e '
            .schema == "gooo/semantic-meta-package-resolver/cases/v2" and
            .status == "CLOSED" and .cases == 12 and .closed == 4 and .unknown == 4 and .refuted == 4 and
            .cells == 12 and .meta_activities == 12 and
            .proof == {CLOSED:4,UNKNOWN:4,REFUTED:4} and .indicators == {CLOSED:4,UNKNOWN:4,REFUTED:4}
          ' "$evidence_dir/conformance/conformance-v2.json" >/dev/null
          ci_end=$(date +%s%3N)
          ci_start=$(cat "$RUNNER_TEMP/ci-start-ms")
          ci_wall=$((ci_end-ci_start))
          bash scripts/write-ci-evidence-v2.sh "$SUBJECT_SHA" "$ci_wall" \
            "$(cat "$RUNNER_TEMP/compile.wall")" "$(cat "$RUNNER_TEMP/compile.rss")" \
            "$(cat "$RUNNER_TEMP/build.wall")" "$(cat "$RUNNER_TEMP/build.rss")" \
            "$(cat "$RUNNER_TEMP/test.wall")" "$(cat "$RUNNER_TEMP/test.rss")" \
            "$(cat "$RUNNER_TEMP/conformance-v2.wall")" "$(cat "$RUNNER_TEMP/conformance-v2.rss")" \
            "$(cat "$RUNNER_TEMP/integration.wall")" "$(cat "$RUNNER_TEMP/integration.rss")" \
            "$evidence_dir/conformance/v2/conformance-v2.json" "$evidence_dir/ci-evidence-v2.json"
          jq -e '
            .schema == "gooo/semantic-meta-package-resolver/ci-evidence/v2" and
            (.authority_contract_digest|test("^sha256:[0-9a-f]{64}$")) and
            (.authority_mapping|length) == 12 and
            ([.authority_mapping[] | select((.semantic_ir_digest|test("^sha256:[0-9a-f]{64}$")) and (.machine_dossier_digest|test("^sha256:[0-9a-f]{64}$")) and (.human_dossier_digest|test("^sha256:[0-9a-f]{64}$")) and (.artifact_manifest_digest|test("^sha256:[0-9a-f]{64}$")))]|length) == 12 and
            ([.authority_mapping[] | {case_id,cell_id,proof_choice,indicator_class}] | sort_by(.case_id)) ==
            ([
              {case_id:"ambiguous-export-unknown",cell_id:"ambiguous_export",proof_choice:"FOUNDATION",indicator_class:"GUARDRAIL"},
              {case_id:"dependency-cycle-refuted",cell_id:"dependency_cycle",proof_choice:"FOUNDATION",indicator_class:"DRIVER"},
              {case_id:"deterministic-diamond-convergence-closed",cell_id:"diamond_convergence",proof_choice:"COHERENCE",indicator_class:"OUTCOME"},
              {case_id:"explicit-fixed-point-merge-closed",cell_id:"fixed_point_merge",proof_choice:"FOUNDATION",indicator_class:"OUTCOME"},
              {case_id:"forged-package-identity-refuted",cell_id:"forged_package_identity",proof_choice:"REGRESSION",indicator_class:"GUARDRAIL"},
              {case_id:"missing-asset-digest-unknown",cell_id:"missing_asset_digest",proof_choice:"REGRESSION",indicator_class:"GUARDRAIL"},
              {case_id:"missing-immutable-release-unknown",cell_id:"missing_immutable_release",proof_choice:"COHERENCE",indicator_class:"DRIVER"},
              {case_id:"same-name-conflicting-digest-refuted",cell_id:"conflicting_digest",proof_choice:"REGRESSION",indicator_class:"DRIVER"},
              {case_id:"same-name-same-digest-dedupe-closed",cell_id:"same_name_same_digest",proof_choice:"REGRESSION",indicator_class:"GUARDRAIL"},
              {case_id:"semantic-export-conflict-refuted",cell_id:"semantic_export_conflict",proof_choice:"COHERENCE",indicator_class:"OUTCOME"},
              {case_id:"toolchain-mismatch-unknown",cell_id:"toolchain_mismatch",proof_choice:"COHERENCE",indicator_class:"OUTCOME"},
              {case_id:"exact-single-import-closed",cell_id:"exact_single",proof_choice:"FOUNDATION",indicator_class:"DRIVER"}
            ] | sort_by(.case_id)) and
            ([.metrics.build_ms,.metrics.test_ms,.metrics.wall_ms,.metrics.peak_rss_kib] | all(type=="number" and floor==. and . >= 0)) and
            .metrics.cache_hits == null and .metrics.cache_misses == null and
            .metrics.state == "UNKNOWN" and .metrics.unknown_reason == "CACHE_METRICS_UNMEASURABLE" and
            .improvement == {value:null,state:"UNKNOWN",reason:"EXACT_BEFORE_AFTER_IDENTITY_PAIR_NOT_AVAILABLE",before:null,after:null} and
            .runtime == {repository_writes:0,local_test_executions:0,cross_project_required_gates:0,contents_permission:"read",output_location:"caller-owned RUNNER_TEMP",failed_runs_preserved:true}
          ' "$evidence_dir/ci-evidence-v2.json" >/dev/null
          cat "$evidence_dir/ci-evidence.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$evidence_dir/ci-evidence-v2.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce zero repository writes
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-meta-package-resolver-evidence-${{ env.SUBJECT_SHA }}
          if-no-files-found: error
          path: ${{ runner.temp }}/evidence
